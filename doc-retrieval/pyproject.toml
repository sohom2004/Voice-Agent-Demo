[project]
name = "doc-retrieval"
version = "0.1.0"
description = "Standalone RAG retrieval tool for ingested documents — deliberately kept separate from sql-mcp/db-agent so document Q&A and database Q&A are two independent, quickly-selectable tools."
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.5.0",
  "psycopg2-binary>=2.9.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["doc_retrieval*"]
